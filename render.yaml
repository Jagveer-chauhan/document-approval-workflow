services:
  # ── Backend (Django + Gunicorn) ────────────────────────────────────────────
  - type: web
    name: document-workflow-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn document_workflow.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "document-workflow-api.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://document-approval-workflow.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://document-approval-workflow.onrender.com,https://document-workflow-api.onrender.com"
      # Remove DB_NAME to use SQLite (no extra setup needed on free tier)
      # Add DB_NAME, DB_USER, DB_PASSWORD, DB_HOST, DB_PORT for PostgreSQL

  # ── Frontend (Vite React) ──────────────────────────────────────────────────
  - type: web
    name: document-approval-workflow
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://document-workflow-api.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
